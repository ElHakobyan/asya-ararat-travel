<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Админ-панель | Asya Ararat Travel</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
:root{--navy:#102a48;--red:#c9262e;--muted:#617080;--bg:#fdf7f4;--line:#e3e7eb}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--navy);background:var(--bg)}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0}
.top{background:#fff;box-shadow:0 2px 14px #0b27461a;position:sticky;top:0;z-index:5}
.top .in{max-width:980px;margin:auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top a{color:var(--navy);text-decoration:none;font-weight:700}
.wrap{max-width:980px;margin:0 auto;padding:26px 18px 60px}
.card{background:#fff;border-radius:14px;box-shadow:0 6px 26px #102a4812;padding:24px}
.login{max-width:420px;margin:50px auto}
label{display:block;font-weight:600;font-size:13px;margin:0 0 7px}
input{width:100%;border:1px solid #dce1e5;border-radius:8px;padding:13px;font:15px Arial;color:var(--navy);margin-bottom:16px}
button{font:600 14px Arial;cursor:pointer;border-radius:50px;padding:11px 20px;border:2px solid transparent}
.primary{background:var(--red);color:#fff}.primary:hover{background:#a71c23}
.ghost{background:#fff;color:var(--navy);border-color:var(--line)}.ghost:hover{background:#f3f5f7}
.good{background:#e9f8ef;color:#0b6b35}.good:hover{background:#d6f1e0}
.warn{background:#fff4e0;color:#8a5a00}.warn:hover{background:#ffe9c2}
.bad{background:#fdecec;color:#a3141c}.bad:hover{background:#fad5d6}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.msg{margin:0 0 16px;padding:12px 14px;border-radius:10px;font-size:14px;line-height:1.5}
.msg.err{background:#fdecec;color:#a3141c}.msg.ok{background:#e9f8ef;color:#0b6b35}.msg.info{background:#eef3f8;color:var(--navy)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
.tab{background:#fff;border:2px solid var(--line);color:var(--navy)}
.tab[aria-selected=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.tab .n{display:inline-block;min-width:22px;margin-left:6px;padding:1px 7px;border-radius:12px;background:#0001;font-size:12px}
.tab[aria-selected=true] .n{background:#fff3}
.review{margin-bottom:14px}
.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.stars{color:#e5a823;letter-spacing:2px;font-size:18px}.stars.big{font-size:26px;margin-bottom:4px}
.meta{color:var(--muted);font-size:13px}
.text{line-height:1.7;margin:12px 0 16px;white-space:pre-wrap;word-break:break-word}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:700}
.b-pending{background:#fff4e0;color:#8a5a00}.b-published{background:#e9f8ef;color:#0b6b35}.b-hidden{background:#eceff2;color:#505a64}
.modes{display:flex;gap:8px;margin:0 0 6px}
.mode{background:#fff;border:2px solid var(--line);color:var(--navy)}.mode[aria-selected=true]{background:var(--red);border-color:var(--red);color:#fff}
.mode .n{display:inline-block;min-width:22px;margin-left:6px;padding:1px 7px;border-radius:12px;background:#0001;font-size:12px}
.mode[aria-selected=true] .n{background:#fff3}
.b-hot{background:#fdecec;color:#a3141c}.b-warm{background:#fff4e0;color:#8a5a00}.b-cold{background:#eceff2;color:#505a64}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 18px;margin:12px 0;font-size:14px}
.facts b{display:block;font-size:12px;color:var(--muted);font-weight:600}
.contact a{color:var(--red);font-weight:700}
details.talk{margin:12px 0}details.talk summary{cursor:pointer;color:var(--muted);font-size:13px}
.talk .m{margin:6px 0;padding:8px 11px;border-radius:10px;font-size:13.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.talk .m.user{background:#fdecec}.talk .m.assistant{background:#eef3f8}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="top"><div class="in"><a href="./">← На сайт</a><strong>Админ-панель</strong><button class="ghost" id="logout" hidden>Выйти</button></div></div>
<main class="wrap">

<section id="notConfigured" class="card" hidden>
  <h2>База данных ещё не подключена</h2>
  <p class="msg info">В файле <b>config.js</b> нужно указать адрес проекта Supabase и публичный ключ. Шаги описаны в файле README.md.</p>
</section>

<section id="loginBox" class="card login" hidden>
  <h2 style="margin-bottom:18px">Вход для администратора</h2>
  <div id="loginMsg"></div>
  <form id="loginForm">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Пароль</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button class="primary" type="submit" id="loginBtn">Войти</button>
  </form>
</section>

<section id="panel" hidden>
  <div id="panelMsg"></div>
  <div class="modes" role="tablist" aria-label="Раздел">
    <button class="mode" role="tab" data-mode="reviews">Оценки<span class="n" id="n-reviews">0</span></button>
    <button class="mode" role="tab" data-mode="leads">Заявки клиентов<span class="n" id="n-leads">0</span></button>
  </div>
  <div id="reviewsView">
  <div class="tabs" role="tablist" aria-label="Статус отзывов">
    <button class="tab" role="tab" data-status="pending">На проверке<span class="n" id="n-pending">0</span></button>
    <button class="tab" role="tab" data-status="published">Опубликованные<span class="n" id="n-published">0</span></button>
    <button class="tab" role="tab" data-status="hidden">Скрытые<span class="n" id="n-hidden">0</span></button>
    <button class="ghost" id="refresh" style="margin-left:auto">Обновить</button>
  </div>
  <div id="bulk" class="card" style="margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap" hidden><span id="bulkText"></span><button class="good" id="publishAll">Опубликовать все</button></div>
  <div id="list"></div>
  </div>
  <div id="leadsView" hidden>
    <div class="tabs" role="tablist" aria-label="Статус заявок">
      <button class="tab" role="tab" data-lstatus="new">Новые<span class="n" id="ln-new">0</span></button>
      <button class="tab" role="tab" data-lstatus="contacted">В работе<span class="n" id="ln-contacted">0</span></button>
      <button class="tab" role="tab" data-lstatus="won">Продано<span class="n" id="ln-won">0</span></button>
      <button class="tab" role="tab" data-lstatus="lost">Отказ<span class="n" id="ln-lost">0</span></button>
    </div>
    <div id="leadList"></div>
  </div>
</section>

</main>

<script src="config.js"></script>
<script>
const CFG = window.SUPABASE_CONFIG || {};
const $ = id => document.getElementById(id);
const STORE = 'asya-admin-session';
const LABELS = {pending: 'На проверке', published: 'Опубликован', hidden: 'Скрыт'};
let session = null, rows = [], current = 'pending';

function say(boxId, text, kind) {
  const box = $(boxId); box.textContent = '';
  if (!text) return;
  const p = document.createElement('p'); p.className = 'msg ' + (kind || 'info'); p.textContent = text; box.append(p);
}
function headers(extra) {
  const h = {apikey: CFG.anonKey, 'Content-Type': 'application/json'};
  if (session && session.access_token) h.Authorization = 'Bearer ' + session.access_token;
  return Object.assign(h, extra || {});
}
function saveSession(s) {
  session = s;
  try { s ? sessionStorage.setItem(STORE, JSON.stringify(s)) : sessionStorage.removeItem(STORE); } catch (e) {}
}
async function refreshToken() {
  if (!session || !session.refresh_token) return false;
  try {
    const r = await fetch(CFG.url + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST', headers: {apikey: CFG.anonKey, 'Content-Type': 'application/json'},
      body: JSON.stringify({refresh_token: session.refresh_token})
    });
    if (!r.ok) return false;
    const d = await r.json();
    saveSession({access_token: d.access_token, refresh_token: d.refresh_token});
    return true;
  } catch (e) { return false; }
}
// fetch with one automatic token refresh when the login has expired
async function api(path, options) {
  let res = await fetch(CFG.url + path, Object.assign({}, options, {headers: headers(options && options.headers)}));
  if (res.status === 401 && await refreshToken()) {
    res = await fetch(CFG.url + path, Object.assign({}, options, {headers: headers(options && options.headers)}));
  }
  return res;
}

async function isAdmin() {
  const r = await api('/rest/v1/admins?select=user_id', {method: 'GET'});
  if (!r.ok) return false;
  const d = await r.json();
  return Array.isArray(d) && d.length > 0;
}

function show(which) {
  $('notConfigured').hidden = which !== 'nc';
  $('loginBox').hidden = which !== 'login';
  $('panel').hidden = which !== 'panel';
  $('logout').hidden = which !== 'panel';
}

async function enterPanel() {
  if (!(await isAdmin())) {
    saveSession(null); show('login');
    say('loginMsg', 'У этого пользователя нет прав администратора. Проверьте, что его добавили в таблицу admins (шаг 4 в README.md).', 'err');
    return;
  }
  show('panel'); await load();
}

async function load() {
  say('panelMsg', '');
  const r = await api('/rest/v1/reviews?select=*&order=created_at.desc', {method: 'GET'});
  if (!r.ok) { say('panelMsg', 'Не удалось загрузить оценки (код ' + r.status + '). Попробуйте обновить страницу или войти заново.', 'err'); return; }
  rows = await r.json(); render(); $('n-reviews').textContent = rows.filter(x => x.status === 'pending').length;
  await loadLeads(); setMode(mode);
}

function render() {
  ['pending', 'published', 'hidden'].forEach(s => { $('n-' + s).textContent = rows.filter(x => x.status === s).length; });
  document.querySelectorAll('[data-status]').forEach(t => t.setAttribute('aria-selected', String(t.dataset.status === current)));
  const list = $('list'); list.textContent = '';
  const items = rows.filter(x => x.status === current);
  $('bulk').hidden = !(current === 'pending' && items.length > 1);
  $('bulkText').textContent = 'Новых оценок: ' + items.length;
  if (!items.length) {
    const e = document.createElement('div'); e.className = 'card empty';
    e.textContent = current === 'pending' ? 'Новых оценок на проверке нет.' : 'Здесь пока пусто.';
    list.append(e); return;
  }
  items.forEach(x => list.append(card(x)));
}

function btn(text, cls, handler) {
  const b = document.createElement('button'); b.type = 'button'; b.className = cls; b.textContent = text;
  b.addEventListener('click', () => handler(b)); return b;
}

function card(x) {
  const c = document.createElement('article'); c.className = 'card review';
  const row = document.createElement('div'); row.className = 'row';
  const n = Math.max(1, Math.min(5, Number(x.rating) || 5));
  const left = document.createElement('div');
  const stars = document.createElement('div'); stars.className = 'stars big';
  stars.textContent = '★'.repeat(n) + '☆'.repeat(5 - n); stars.setAttribute('aria-label', n + ' из 5');
  const meta = document.createElement('div'); meta.className = 'meta';
  let when = ''; try { when = new Date(x.created_at).toLocaleString('ru-RU', {dateStyle: 'medium', timeStyle: 'short'}); } catch (e) {}
  meta.textContent = [x.name, x.trip, when].filter(Boolean).join(' · ');
  left.append(stars, meta);
  const badge = document.createElement('span'); badge.className = 'badge b-' + x.status; badge.textContent = LABELS[x.status] || x.status;
  row.append(left, badge);
  c.append(row);
  if (x.text) { const text = document.createElement('p'); text.className = 'text'; text.textContent = x.text; c.append(text); }
  const actions = document.createElement('div'); actions.className = 'actions'; actions.style.marginTop = '14px';
  if (x.status !== 'published') actions.append(btn('Опубликовать', 'good', b => setStatus(x, 'published', b)));
  if (x.status !== 'hidden') actions.append(btn('Скрыть', 'warn', b => setStatus(x, 'hidden', b)));
  actions.append(btn('Удалить', 'bad', b => remove(x, b)));
  c.append(actions);
  return c;
}

async function setStatus(x, status, b) {
  b.disabled = true;
  const r = await api('/rest/v1/reviews?id=eq.' + encodeURIComponent(x.id), {method: 'PATCH', headers: {Prefer: 'return=minimal'}, body: JSON.stringify({status})});
  if (!r.ok) { b.disabled = false; say('panelMsg', 'Не удалось изменить статус (код ' + r.status + ').', 'err'); return; }
  x.status = status; say('panelMsg', status === 'published' ? 'Оценка опубликована на сайте.' : 'Оценка скрыта с сайта.', 'ok'); render();
}

async function remove(x, b) {
  if (!confirm('Удалить эту оценку (' + x.rating + ' из 5) навсегда? Это нельзя отменить.\n\nЕсли оценка просто не нужна на сайте, лучше нажать «Скрыть».')) return;
  b.disabled = true;
  const r = await api('/rest/v1/reviews?id=eq.' + encodeURIComponent(x.id), {method: 'DELETE', headers: {Prefer: 'return=minimal'}});
  if (!r.ok) { b.disabled = false; say('panelMsg', 'Не удалось удалить оценку (код ' + r.status + ').', 'err'); return; }
  rows = rows.filter(y => y.id !== x.id); say('panelMsg', 'Оценка удалена.', 'ok'); render();
}

/* ---------- Заявки клиентов (AI-агент) ---------- */
const LSTATUS = {new: 'Новая', contacted: 'В работе', won: 'Продано', lost: 'Отказ'};
const READY = {hot: '🔥 Горячий', warm: '🟡 Тёплый', cold: '⚪ Холодный'};
let leads = [], leadsOk = true, lcurrent = 'new', mode = 'reviews';

async function loadLeads() {
  const r = await api('/rest/v1/leads?select=*&order=created_at.desc', {method: 'GET'});
  if (!r.ok) { leadsOk = false; leads = []; $('n-leads').textContent = '–'; return; }
  leadsOk = true; leads = await r.json(); renderLeads();
}
function contactNode(v) {
  const span = document.createElement('span'); span.className = 'contact';
  const text = String(v || '');
  const digits = text.replace(/\D/g, '');
  if (/^\+?[\d\s()-]{7,}$/.test(text) && digits.length >= 7 && digits.length <= 15) {
    const a = document.createElement('a'); a.href = 'https://wa.me/' + digits; a.target = '_blank'; a.rel = 'noopener'; a.textContent = text + ' (WhatsApp)'; span.append(a);
  } else if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(text)) {
    const a = document.createElement('a'); a.href = 'mailto:' + text; a.textContent = text; span.append(a);
  } else { span.textContent = text; }
  return span;
}
function fact(label, value) {
  const d = document.createElement('div'); const b = document.createElement('b'); b.textContent = label;
  const v = document.createElement('span'); v.textContent = value || '—'; d.append(b, v); return d;
}
function leadCard(x) {
  const c = document.createElement('article'); c.className = 'card review';
  const row = document.createElement('div'); row.className = 'row';
  const left = document.createElement('div');
  const h = document.createElement('h3'); h.textContent = x.name || 'Без имени';
  const meta = document.createElement('div'); meta.className = 'meta';
  let when = ''; try { when = new Date(x.created_at).toLocaleString('ru-RU', {dateStyle: 'medium', timeStyle: 'short'}); } catch (e) {}
  meta.textContent = when;
  left.append(h, meta);
  const badge = document.createElement('span'); badge.className = 'badge b-' + (READY[x.readiness] ? x.readiness : 'warm'); badge.textContent = READY[x.readiness] || x.readiness;
  row.append(left, badge); c.append(row);
  const facts = document.createElement('div'); facts.className = 'facts';
  const contactBox = document.createElement('div'); const cb = document.createElement('b'); cb.textContent = 'Контакт'; contactBox.append(cb, contactNode(x.contact));
  facts.append(contactBox, fact('Тур', x.tour_interest), fact('Человек', x.travelers == null ? '' : String(x.travelers)), fact('Даты', x.dates), fact('Бюджет', x.budget));
  c.append(facts);
  if (x.summary) { const t = document.createElement('p'); t.className = 'text'; t.textContent = x.summary; c.append(t); }
  if (Array.isArray(x.transcript) && x.transcript.length) {
    const d = document.createElement('details'); d.className = 'talk';
    const sm = document.createElement('summary'); sm.textContent = 'Переписка (' + x.transcript.length + ')'; d.append(sm);
    x.transcript.forEach(m => { const p = document.createElement('div'); p.className = 'm ' + (m.role === 'assistant' ? 'assistant' : 'user'); p.textContent = (m.role === 'assistant' ? 'Помощник: ' : 'Клиент: ') + String(m.content || ''); d.append(p); });
    c.append(d);
  }
  const actions = document.createElement('div'); actions.className = 'actions';
  if (x.status !== 'contacted') actions.append(btn('В работе', 'warn', b => setLead(x, 'contacted', b)));
  if (x.status !== 'won') actions.append(btn('Продано', 'good', b => setLead(x, 'won', b)));
  if (x.status !== 'lost') actions.append(btn('Отказ', 'ghost', b => setLead(x, 'lost', b)));
  actions.append(btn('Удалить', 'bad', b => removeLead(x, b)));
  c.append(actions); return c;
}
function renderLeads() {
  const order = {hot: 0, warm: 1, cold: 2};
  Object.keys(LSTATUS).forEach(s => { $('ln-' + s).textContent = leads.filter(x => x.status === s).length; });
  $('n-leads').textContent = leads.filter(x => x.status === 'new').length;
  document.querySelectorAll('[data-lstatus]').forEach(t => t.setAttribute('aria-selected', String(t.dataset.lstatus === lcurrent)));
  const list = $('leadList'); list.textContent = '';
  if (!leadsOk) {
    const e = document.createElement('div'); e.className = 'card empty';
    e.textContent = 'Таблица заявок ещё не создана. Выполните файл supabase-agent.sql в Supabase (см. README.md).'; list.append(e); return;
  }
  const items = leads.filter(x => x.status === lcurrent).sort((a, b) => (order[a.readiness] ?? 1) - (order[b.readiness] ?? 1) || new Date(b.created_at) - new Date(a.created_at));
  if (!items.length) { const e = document.createElement('div'); e.className = 'card empty'; e.textContent = 'Здесь пока пусто.'; list.append(e); return; }
  items.forEach(x => list.append(leadCard(x)));
}
async function setLead(x, status, b) {
  b.disabled = true;
  const r = await api('/rest/v1/leads?id=eq.' + encodeURIComponent(x.id), {method: 'PATCH', headers: {Prefer: 'return=minimal'}, body: JSON.stringify({status})});
  if (!r.ok) { b.disabled = false; say('panelMsg', 'Не удалось изменить статус заявки (код ' + r.status + ').', 'err'); return; }
  x.status = status; say('panelMsg', 'Статус заявки: ' + LSTATUS[status] + '.', 'ok'); renderLeads();
}
async function removeLead(x, b) {
  if (!confirm('Удалить заявку ' + (x.name || x.contact) + ' навсегда? Это нельзя отменить.')) return;
  b.disabled = true;
  const r = await api('/rest/v1/leads?id=eq.' + encodeURIComponent(x.id), {method: 'DELETE', headers: {Prefer: 'return=minimal'}});
  if (!r.ok) { b.disabled = false; say('panelMsg', 'Не удалось удалить заявку (код ' + r.status + ').', 'err'); return; }
  leads = leads.filter(y => y.id !== x.id); say('panelMsg', 'Заявка удалена.', 'ok'); renderLeads();
}
function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode').forEach(t => t.setAttribute('aria-selected', String(t.dataset.mode === m)));
  $('reviewsView').hidden = m !== 'reviews'; $('leadsView').hidden = m !== 'leads';
  if (m === 'leads') renderLeads();
}
document.querySelectorAll('.mode').forEach(t => t.addEventListener('click', () => setMode(t.dataset.mode)));
document.querySelectorAll('[data-lstatus]').forEach(t => t.addEventListener('click', () => { lcurrent = t.dataset.lstatus; renderLeads(); }));

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault(); say('loginMsg', ''); $('loginBtn').disabled = true;
  try {
    const r = await fetch(CFG.url + '/auth/v1/token?grant_type=password', {
      method: 'POST', headers: {apikey: CFG.anonKey, 'Content-Type': 'application/json'},
      body: JSON.stringify({email: $('email').value.trim(), password: $('password').value})
    });
    if (!r.ok) { say('loginMsg', 'Неверный email или пароль.', 'err'); return; }
    const d = await r.json();
    saveSession({access_token: d.access_token, refresh_token: d.refresh_token});
    $('password').value = '';
    await enterPanel();
  } catch (err) { say('loginMsg', 'Нет связи с сервером. Проверьте интернет и попробуйте ещё раз.', 'err'); }
  finally { $('loginBtn').disabled = false; }
});
$('logout').addEventListener('click', () => { saveSession(null); rows = []; show('login'); });
$('refresh').addEventListener('click', load);
$('publishAll').addEventListener('click', async b => {
  const n = rows.filter(x => x.status === 'pending').length;
  if (!confirm('Опубликовать все новые оценки (' + n + ')?')) return;
  const btnEl = $('publishAll'); btnEl.disabled = true;
  const r = await api('/rest/v1/reviews?status=eq.pending', {method: 'PATCH', headers: {Prefer: 'return=minimal'}, body: JSON.stringify({status: 'published'})});
  btnEl.disabled = false;
  if (!r.ok) { say('panelMsg', 'Не удалось опубликовать оценки (код ' + r.status + ').', 'err'); return; }
  rows.forEach(x => { if (x.status === 'pending') x.status = 'published'; });
  say('panelMsg', 'Опубликовано оценок: ' + n + '.', 'ok'); render();
});
document.querySelectorAll('[data-status]').forEach(t => t.addEventListener('click', () => { current = t.dataset.status; render(); }));

(async function init() {
  if (!CFG.url || !CFG.anonKey) { show('nc'); return; }
  try { const saved = JSON.parse(sessionStorage.getItem(STORE) || 'null'); if (saved && saved.access_token) session = saved; } catch (e) {}
  if (session) { await enterPanel(); } else { show('login'); }
})();
</script>
